<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown</title>
  <style>
    body { font-family: system-ui, Arial; padding: 24px; max-width: 720px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .big { font-size: 40px; font-weight: 800; }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
    .box { background: #f6f6f6; border-radius: 12px; padding: 12px; text-align: center; }
    .label { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: .08em; }
    .num { font-size: 28px; font-weight: 800; }
    .bar { height: 14px; background: #eee; border-radius: 999px; overflow: hidden; margin-top: 16px; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4f46e5, #06b6d4); }
    .small { margin-top: 10px; opacity: 0.75; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="big" id="title">Countdown</div>
    <div class="small">Target: <span id="targetText"></span></div>

    <div class="row">
      <div class="box"><div class="label">Days</div><div class="num" id="days">0</div></div>
      <div class="box"><div class="label">Hours</div><div class="num" id="hours">0</div></div>
    </div>

  <script>
    // 1) SET YOUR TARGET DATE HERE (YYYY-MM-DD)
    // If you want a specific time, use: "2026-05-26T09:00:00"
    const target = new Date("2026-05-26T00:00:00");

    // 2) OPTIONAL: start date for progress bar (today by default)
    const start = new Date(); // change to new Date("2026-01-01T00:00:00") if you want

    document.getElementById("targetText").textContent = target.toLocaleString();

    function tick() {
      const now = new Date();
      const diffMs = target - now;

      if (diffMs <= 0) {
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        return;
      }

      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;

    tick();
    setInterval(tick, 250); // updates 4x/second so it feels smooth
  </script>
</body>
</html>
