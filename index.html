<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Days Countdown</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --text: #e8eefc;
      --muted: rgba(232, 238, 252, 0.75);
      --accent: #7dd3fc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 30% 20%, #16254a 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .card {
      width: min(640px, calc(100vw - 32px));
      background: rgba(17, 26, 46, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      text-align: center;
    }

    .title { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .days  { font-size: 96px; font-weight: 900; line-height: 1; margin: 12px 0 6px; color: var(--accent); }
    .label { font-size: 18px; color: var(--text); opacity: 0.9; }
    .target { margin-top: 14px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Countdown</div>
    <div class="days" id="days">0</div>
    <div class="label">days left</div>
    <div class="target">Target: <span id="targetText"></span></div>
  </div>

  <script>
    // May 26, 2026 at 12:00 AM (start of the day), LOCAL time
    const target = new Date(2026, 4, 26);

    document.getElementById("targetText").textContent = target.toLocaleDateString();

    function tick() {
      const now = new Date();

      // Difference in whole days (ceiling so "2.1 days" shows as 3 days left)
      const diffMs = target - now;
      const daysLeft = Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));

      document.getElementById("days").textContent = daysLeft;

      if (diffMs <= 0) {
        document.querySelector(".label").textContent = "days left (done)";
      }
    }

    tick();
    // Update once per minute is plenty for "days only"
    setInterval(tick, 60 * 1000);
  </script>
</body>
</html>
